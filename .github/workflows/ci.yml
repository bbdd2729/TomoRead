name: CI Build

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.44.8

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true
      - run: flutter pub get
      - run: flutter analyze lib test
      - run: flutter test

  linux:
    name: Linux
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build libgtk-3-dev libsqlite3-dev
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v7
        with:
          name: tomoread-ci-linux
          path: build/linux/x64/release/bundle/
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: tomoread-ci-windows
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android
    needs: verify
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: -Dorg.gradle.caching=true -Dorg.gradle.parallel=true
    steps:
      - uses: actions/checkout@v6
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v5
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true
      - run: flutter pub get
      - run: flutter build apk --debug
      - name: Upload Android debug APK
        uses: actions/upload-artifact@v7
        with:
          name: tomoread-ci-android-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
