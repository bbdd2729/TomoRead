<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TomoRead EPUB runtime</title>
    <style>
      html, body, #reader-stage {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
    </style>
    <script>
      const reportRuntimeError = event => {
        const message = event.reason?.message || event.error?.message || event.message
        if (!message) return
        window.TomoRead?.postMessage(JSON.stringify({ type: 'runtimeError', message }))
        window.chrome?.webview?.postMessage({ type: 'runtimeError', message })
      }
      window.addEventListener('error', reportRuntimeError)
      window.addEventListener('unhandledrejection', reportRuntimeError)
    </script>
  </head>
  <body>
    <main id="reader-stage" aria-label="EPUB reader"></main>
    <script type="module" src="./tomoread-reader.js"></script>
  </body>
</html>
