<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TomoRead EPUB runtime</title>
    <style>
      html, body, #reader-stage {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
    </style>
    <script>
      const reportRuntimeError = event => {
        const message = event.reason?.message || event.error?.message || event.message
        if (!message) return
        if (/^ResizeObserver loop (limit exceeded|completed with undelivered notifications)\.?$/.test(message)) {
          return
        }
        const payload = { bridgeVersion: 1, type: 'runtimeError', message }
        if (window.chrome?.webview?.postMessage) {
          window.chrome.webview.postMessage(payload)
        } else if (window.flutter_inappwebview?.callHandler) {
          window.flutter_inappwebview.callHandler('TomoRead', JSON.stringify(payload))
        } else {
          window.TomoRead?.postMessage(JSON.stringify(payload))
        }
      }
      window.addEventListener('error', reportRuntimeError)
      window.addEventListener('unhandledrejection', reportRuntimeError)
    </script>
  </head>
  <body>
    <main id="reader-stage" aria-label="EPUB reader"></main>
    <script src="./foliate-paginator.js"></script>
    <script src="./epubcfi.js"></script>
    <script src="./tomoread-reader.js"></script>
  </body>
</html>
